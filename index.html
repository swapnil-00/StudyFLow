<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>StudyFlow — Library Management</title>
  <meta name="description" content="StudyFlow is a production-quality Study Library Management SaaS for owners to manage seats, students, memberships, payments, and attendance." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f766e" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/tokens.css?v=2.2" />
  <link rel="stylesheet" href="/css/base.css?v=2.2" />
  <link rel="stylesheet" href="/css/layout.css?v=2.2" />
  <link rel="stylesheet" href="/css/components.css?v=2.2" />
  <link rel="stylesheet" href="/css/pages.css?v=2.2" />
</head>
<body>
  <div id="app">
    <!-- Loading screen -->
    <div id="app-loader" style="
      position:fixed;inset:0;
      background:var(--color-bg-primary, #0f172a);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
      z-index:9999;
      transition:opacity 0.3s;
    ">
      <div style="
        width:56px;height:56px;
        background:linear-gradient(135deg, #0f766e 0%, #0b5a54 100%);
        border-radius:16px;
        display:flex;align-items:center;justify-content:center;
        font-size:22px;font-weight:800;color:white;letter-spacing:-0.5px;
        box-shadow: 0 8px 24px rgba(15, 118, 110,0.4);
      ">SF</div>
      <div style="text-align:center;">
        <div style="font-size:22px;font-weight:700;color:#f8fafc;letter-spacing:-0.5px;">StudyFlow</div>
        <div id="app-loader-msg" style="font-size:13px;color:#94a3b8;margin-top:4px;">Loading your library...</div>
      </div>
      <div id="app-loader-spinner" class="spinner" style="border-color:rgba(15, 118, 110,0.2);border-top-color:#0f766e;"></div>

      <div id="app-error-box" style="display:none;max-width:440px;margin-top:16px;padding:16px 20px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;text-align:center;">
        <div style="font-size:14px;font-weight:600;color:#f87171;margin-bottom:6px;">Unable to initialize application</div>
        <div id="app-error-detail" style="font-size:12px;color:#cbd5e1;line-height:1.5;margin-bottom:14px;"></div>
        <div style="display:flex;gap:8px;justify-content:center;">
          <button id="app-error-retry-btn" style="padding:8px 16px;background:#0f766e;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">Retry</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Auth SDK is loaded on demand by js/pages/auth.js (login/signup/invite only) -->

  <!-- Single self-contained production bundle (no inline scripts for strict CSP) -->
  <script src="/js/bundle.js?v=2.2" defer></script>
</body>
</html>
