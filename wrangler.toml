# StudyFlow — Cloudflare Worker
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "studyflow"
main = "worker/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Smart Placement: run the Worker near the database, not near the user,
# so every DB round-trip is fast. Users are in India; Neon is in us-east-2.
[placement]
mode = "smart"

# Observability — replaces Vercel's function logs
[observability]
enabled = true

# Static assets from the build output
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Hyperdrive binding — the owner creates the Hyperdrive config in the dashboard
# pointing at the Neon connection string, then fills in the ID here.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "7f49a0d576e041bcb994e1ebb31fbb7f"

# Daily job (lib/jobs.js): expire lapsed WhatsApp add-ons, then send automatic reminders.
# 03:30 UTC = 09:00 IST. Test locally: wrangler dev --test-scheduled, then
# curl "http://localhost:8787/__scheduled?cron=30+3+*+*+*"
[triggers]
crons = ["30 3 * * *"]

# Plain-text (non-secret) vars. Secrets are set with `wrangler secret put`:
#   CASHFREE_APP_ID, CASHFREE_SECRET_KEY            (payments)
#   WHATSAPP_TOKEN, WHATSAPP_PHONE_ID               (automatic reminders)
[vars]
NODE_ENV = "production"
AUTH_PASSWORD_ENABLED = "false"
APP_URL = "https://studyflow.studyflow01.workers.dev"
CASHFREE_ENV = "sandbox"
# Automatic WhatsApp add-on is ON HOLD: cannot be bought, shown or sent until "true"
# (also needs WHATSAPP_TOKEN / WHATSAPP_PHONE_ID secrets and approved templates).
AUTO_NOTIFY_ENABLED = "false"
